<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin McCune and the Twine</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="home-page">
    <div class="page-shell home-shell">
      <main class="basic-layout">
        <nav class="social-row" aria-label="Listen and follow">
          <!-- Placeholder hrefs guessed from each file name -- swap in the
               band's real profile URLs when ready. -->
          <a href="https://www.instagram.com/" class="social-link" target="_blank" rel="noreferrer">
            <img src="./assets/social/insta-button.png" alt="Instagram" />
          </a>
          <a href="https://open.spotify.com/" class="social-link" target="_blank" rel="noreferrer">
            <img src="./assets/social/spotify-button.png" alt="Spotify" />
          </a>
          <a href="https://music.apple.com/" class="social-link" target="_blank" rel="noreferrer">
            <img src="./assets/social/apple-music-button.png" alt="Apple Music" />
          </a>
          <a href="https://bandcamp.com/" class="social-link" target="_blank" rel="noreferrer">
            <img src="./assets/social/bandcamp-button.png" alt="Bandcamp" />
          </a>
          <a href="https://www.youtube.com/" class="social-link" target="_blank" rel="noreferrer">
            <img src="./assets/social/youtube-button.png" alt="YouTube" />
          </a>
        </nav>

        <section class="notecard-hero">
          <div class="notecard-stack">
            <img
              src="./assets/title%20notecard/notecard%20no%20underline.png"
              alt="Kevin McCune and the Twine — about, blog, contact"
              class="notecard-image"
            />

            <a
              href="./about.html"
              class="notecard-hotspot notecard-hotspot-about"
              aria-label="About"
            ></a>
            <img
              src="./assets/title%20notecard/about%20hover.png"
              alt=""
              aria-hidden="true"
              class="notecard-image notecard-hover-layer"
            />

            <a
              href="./blog.html"
              class="notecard-hotspot notecard-hotspot-blog"
              aria-label="Blog"
            ></a>
            <img
              src="./assets/title%20notecard/blog%20hover.png"
              alt=""
              aria-hidden="true"
              class="notecard-image notecard-hover-layer"
            />

            <a
              href="mailto:kevin@domain.com"
              class="notecard-hotspot notecard-hotspot-contact"
              aria-label="Contact"
            ></a>
            <img
              src="./assets/title%20notecard/contact%20hover.png"
              alt=""
              aria-hidden="true"
              class="notecard-image notecard-hover-layer"
            />
          </div>
        </section>

        <section class="photo-pile" aria-label="Band photos">
          <img
            src="./assets/band-photos/img-4618-group.jpg"
            alt="The band getting set up outdoors before a show"
            class="pile-photo pile-photo-group"
          />
          <img
            src="./assets/band-photos/img-2263-singer.jpg"
            alt="Kevin singing into a mic at a house show"
            class="pile-photo pile-photo-singer"
          />
          <img
            src="./assets/band-photos/img-4779-basement.jpg"
            alt="The band playing a basement show"
            class="pile-photo pile-photo-basement"
          />
        </section>
      </main>

      <footer class="footer">
        <div class="footer-paper">
          <img
            src="./assets/footer/torn-paper-strip.png"
            alt=""
            aria-hidden="true"
            class="footer-paper-image"
          />
          <a href="mailto:kevin@domain.com" class="footer-paper-link">email the band</a>
        </div>
      </footer>
    </div>
  </body>
</html>
