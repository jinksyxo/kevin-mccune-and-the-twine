<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post | Kevin McCune and the Twine</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div class="page-shell inner-page">
      <header class="hero">
        <p class="eyebrow">blog</p>
        <h1>Kevin McCune and the Twine</h1>
      </header>

      <main class="content-card" id="post-content">
        <p>Loading…</p>
      </main>

      <p class="back-link"><a href="/blog">back to blog</a></p>
    </div>

    <script>
      function escapeHtml(value) {
        const div = document.createElement('div')
        div.textContent = value || ''
        return div.innerHTML
      }

      function formatDate(value) {
        const date = new Date(value)
        if (Number.isNaN(date.getTime())) return ''
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })
      }

      function slugFromPath() {
        const parts = window.location.pathname.split('/').filter(Boolean)
        return parts.length >= 2 && parts[0] === 'post' ? decodeURIComponent(parts[1]) : ''
      }

      async function loadPost() {
        const container = document.getElementById('post-content')
        const slug = slugFromPath()

        if (!slug) {
          container.innerHTML = '<p>Post not found.</p>'
          return
        }

        try {
          const response = await fetch(`/api/posts/${encodeURIComponent(slug)}`)

          if (!response.ok) {
            container.innerHTML = '<p>That post could not be found.</p>'
            return
          }

          const { post } = await response.json()
          document.title = `${post.title} | Kevin McCune and the Twine`

          const image = post.headerImage
            ? `<img src="${post.headerImage}" alt="" class="post-header-image" />`
            : ''
          const bodyHtml = window.marked ? window.marked.parse(post.bodyMarkdown || '') : escapeHtml(post.bodyMarkdown)

          container.innerHTML = `
            ${image}
            <p class="post-card-date">${formatDate(post.createdAt)}</p>
            <h2>${escapeHtml(post.title)}</h2>
            <div class="post-body">${bodyHtml}</div>
          `
        } catch (error) {
          container.innerHTML = '<p>That post could not be loaded right now.</p>'
        }
      }

      loadPost()
    </script>
  </body>
</html>
